<!doctype html>
<html lang="vi">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VS46EZMCS4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VS46EZMCS4');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ebook + Botpress</title>

  <style>
    /* Giữ nguyên cấu hình Ebook của bạn */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe[src*="heyzine.com"] {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
  </style>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true, // Cho phép dùng \$
        processEnvironments: true,
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>

  <iframe
    src="https://heyzine.com/flip-book/4cd679d81b.html"  
    allowfullscreen
    allow="clipboard-write"
    scrolling="no">
  </iframe>

  <script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2026/01/20/13/20260120133434-8RWTQ323.js" defer></script>
  
  <script>
    // 1. Hàm cố định kích thước Botpress
    function fixBotSize() {
      const allDivs = document.body.querySelectorAll('div');
      
      allDivs.forEach(div => {
        if (div.shadowRoot) {
            div.style.setProperty('zoom', '0.75', 'important');
            div.style.setProperty('position', 'fixed', 'important');
            div.style.setProperty('bottom', '20px', 'important');
            div.style.setProperty('right', '20px', 'important');
            div.style.setProperty('display', 'block', 'important');
            div.style.setProperty('visibility', 'visible', 'important');
            div.style.setProperty('z-index', '9999', 'important');
        }
      });
    }

    // [PHẦN CẬP NHẬT 2] Hàm ép MathJax dịch công thức liên tục (Trị lỗi hiệu ứng gõ chữ)
    function forceMathJaxRender() {
      if (!window.MathJax || !window.MathJax.typesetPromise) return;

      const allDivs = document.body.querySelectorAll('div');
      allDivs.forEach(div => {
        if (div.shadowRoot) {
          // Lệnh typesetClear giúp xóa bộ nhớ tạm, ép MathJax quét lại bản hoàn chỉnh của tin nhắn
          MathJax.typesetClear([div.shadowRoot]);
          MathJax.typesetPromise([div.shadowRoot]).catch((err) => console.log('Lỗi render LaTeX:', err));
        }
      });
    }

    // Chạy fixBotSize nhanh trong 10 giây đầu để set up giao diện
    const checker = setInterval(fixBotSize, 500);
    setTimeout(() => clearInterval(checker), 10000);

    // Chạy bộ quét MathJax liên tục mỗi 1.5 giây
    setInterval(forceMathJaxRender, 1500);
  </script>

</body>
</html>
