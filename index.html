<!doctype html>
<html lang="vi">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VS46EZMCS4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VS46EZMCS4');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ebook + Botpress</title>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    iframe[src*="heyzine.com"] {
      width: 100%; height: 100vh; border: none; display: block;
      position: absolute; top: 0; left: 0; z-index: 0;
    }
  </style>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: { fontCache: 'global' },
      startup: {
        typeset: false // Tắt tự động render ban đầu, giao toàn quyền cho setInterval
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>

  <iframe src="https://heyzine.com/flip-book/4cd679d81b.html" allowfullscreen allow="clipboard-write" scrolling="no"></iframe>

  <script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2026/01/20/13/20260120133434-8RWTQ323.js" defer></script>
  
  <script>
    // 1. Hàm giữ nguyên kích thước Botpress
    function fixBotSize() {
      // Quét TẤT CẢ các thẻ (*) thay vì chỉ quét thẻ DIV
      const allElements = document.body.querySelectorAll('*');
      allElements.forEach(el => {
        if (el.shadowRoot) {
            el.style.setProperty('zoom', '0.75', 'important');
            el.style.setProperty('position', 'fixed', 'important');
            el.style.setProperty('bottom', '20px', 'important');
            el.style.setProperty('right', '20px', 'important');
            el.style.setProperty('display', 'block', 'important');
            el.style.setProperty('visibility', 'visible', 'important');
            el.style.setProperty('z-index', '9999', 'important');
        }
      });
    }

    // 2. Hàm ép MathJax quét Shadow DOM chống Crash
    function forceMathJaxRender() {
      if (!window.MathJax || !window.MathJax.typesetPromise) return;

      const allElements = document.body.querySelectorAll('*');
      allElements.forEach(el => {
        if (el.shadowRoot) {
          // Bỏ truyền tham số vào typesetClear để tránh lỗi crash của MathJax v3
          MathJax.typesetClear();
          // Ép render lại toàn bộ nội dung trong Botpress
          MathJax.typesetPromise([el.shadowRoot]).catch(err => {});
        }
      });
    }

    // Chạy fixBotSize
    const checker = setInterval(fixBotSize, 500);
    setTimeout(() => clearInterval(checker), 10000);

    // Chạy MathJax liên tục mỗi 1.5 giây
    setInterval(forceMathJaxRender, 1500);
  </script>

</body>
</html>
