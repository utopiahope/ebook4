<!doctype html>
<html lang="vi">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VS46EZMCS4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VS46EZMCS4');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ebook + Botpress</title>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    iframe[src*="heyzine.com"] {
      width: 100%; height: 100vh; border: none; display: block;
      position: absolute; top: 0; left: 0; z-index: 0;
    }
  </style>

  <!-- Đã thay thế MathJax bằng KaTeX (Hỗ trợ Shadow DOM tốt hơn) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>

  <iframe src="https://heyzine.com/flip-book/4cd679d81b.html" allowfullscreen allow="clipboard-write" scrolling="no"></iframe>

  <script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2026/01/20/13/20260120133434-8RWTQ323.js" defer></script>
  
  <script>
    // 1. Hàm giữ nguyên kích thước Botpress
    function fixBotSize() {
      const allElements = document.body.querySelectorAll('*');
      allElements.forEach(el => {
        if (el.shadowRoot) {
            el.style.setProperty('zoom', '0.75', 'important');
            el.style.setProperty('position', 'fixed', 'important');
            el.style.setProperty('bottom', '20px', 'important');
            el.style.setProperty('right', '20px', 'important');
            el.style.setProperty('display', 'block', 'important');
            el.style.setProperty('visibility', 'visible', 'important');
            el.style.setProperty('z-index', '9999', 'important');
        }
      });
    }

    // 2. Hàm ép KaTeX quét và render toán học bên trong Shadow DOM
    function forceMathRender() {
      // Đảm bảo thư viện auto-render của KaTeX đã tải xong
      if (!window.renderMathInElement) return;

      const allElements = document.body.querySelectorAll('*');
      allElements.forEach(el => {
        if (el.shadowRoot) {
          // Tiêm CSS của KaTeX vào bên trong Shadow DOM để công thức không bị vỡ khung
          if (!el.shadowRoot.querySelector('#katex-css')) {
            const link = document.createElement('link');
            link.id = 'katex-css';
            link.rel = 'stylesheet';
            link.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css';
            el.shadowRoot.appendChild(link);
          }
          
          // Quét và render công thức toán học
          renderMathInElement(el.shadowRoot, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false // Bỏ qua lỗi nhỏ để tránh crash ứng dụng
          });
        }
      });
    }

    // Chạy fixBotSize
    const checker = setInterval(fixBotSize, 500);
    setTimeout(() => clearInterval(checker), 10000);

    // Chạy quét KaTeX liên tục mỗi 1.5 giây
    setInterval(forceMathRender, 1500);
  </script>

</body>
</html>
