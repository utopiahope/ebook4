<!doctype html>
<html lang="vi">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VS46EZMCS4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VS46EZMCS4');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ebook + Botpress</title>

  <style>
    /* Giữ nguyên cấu hình Ebook của bạn */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe[src*="heyzine.com"] {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
  </style>

  <!-- [PHẦN THÊM MỚI 1] Cấu hình và tải thư viện MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>

  <iframe
    src="https://heyzine.com/flip-book/4cd679d81b.html"  
    allowfullscreen
    allow="clipboard-write"
    scrolling="no">
  </iframe>

  <script src="https://cdn.botpress.cloud/webchat/v3.5/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2026/01/20/13/20260120133434-8RWTQ323.js" defer></script>
  
  <script>
    function fixBotSize() {
      // Tìm tất cả các thẻ DIV để bắt giao diện Botpress
      const allDivs = document.body.querySelectorAll('div');
      
      allDivs.forEach(div => {
        // Nếu tìm thấy giao diện Botpress (có Shadow DOM)
        if (div.shadowRoot) {
            // Dùng lệnh ZOOM 0.75 để thu nhỏ toàn bộ widget còn 75%
            div.style.setProperty('zoom', '0.75', 'important');
            div.style.setProperty('position', 'fixed', 'important');
            div.style.setProperty('bottom', '20px', 'important');
            div.style.setProperty('right', '20px', 'important');
            div.style.setProperty('display', 'block', 'important');
            div.style.setProperty('visibility', 'visible', 'important');
            div.style.setProperty('z-index', '9999', 'important');

            // [PHẦN THÊM MỚI 2] Gắn bộ quét MathJax vào thẳng Shadow DOM của Botpress
            // Lệnh if này đảm bảo việc gắn bộ theo dõi chỉ diễn ra 1 lần duy nhất
            if (!div.dataset.mathjaxObserved) {
              const observer = new MutationObserver(() => {
                if (window.MathJax && window.MathJax.typesetPromise) {
                  // Ép MathJax chỉ quét và dịch công thức bên trong khung chat của Botpress
                  MathJax.typesetPromise([div.shadowRoot]).catch((err) => console.log('Lỗi render LaTeX:', err));
                }
              });
              
              // Theo dõi mọi tin nhắn mới xuất hiện trong khung chat
              observer.observe(div.shadowRoot, { childList: true, subtree: true });
              div.dataset.mathjaxObserved = "true"; // Đánh dấu là đã gắn thành công
            }
        }
      });
    }

    // Chạy kiểm tra liên tục trong 10 giây đầu để đảm bảo Bot nhận lệnh
    const checker = setInterval(fixBotSize, 500);
    setTimeout(() => clearInterval(checker), 10000);
  </script>

</body>
</html>
